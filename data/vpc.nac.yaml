---
nxos:
  templates:
    - name: VPC
      type: model
      configuration:
        vpc:
          domain_id: ${switch_vpc_id}
          peer_link_port_channel: 500
          peer_gateway: true  # Permet au switch de répondre aux requêtes ARP du peer
          peer_switch: true   # Active le "vPC Peer Switch" (recommandé)
          ip_arp_synchronize: true
          ipv6_nd_synchronize: true
          auto_recovery: true
          delay_restore: 150
          delay_restore_interface_vlan: 30
          keepalive:
            source_ip: ${mgmt_ip}
            destination_ip: ${vpc_peer_ip}
            vrf: management
            interval: 1000
            timeout: 3
        interfaces: 
          port_channels:
            - id: 500
              
              description: "vPC Peer-Link"
              switchport:
                mode: trunk
                trunk_allowed_vlans:
                  ranges:
                    - from: 1
                      to: 4094
              lacp:
                rate: fast
                min_links: 1
                max_bundle: 32
                spanning_tree:
                  port_type: network
                  guard: none
          ethernets:
            - id: ${vpc_peer_link_members[0]}
              description: "vPC Peer-Link"
              channel_group_force: true
              channel_group: 500
              channel_group_mode: active
            - id: ${vpc_peer_link_members[1]}
              description: "vPC Peer-Link"
              channel_group_force: true
              channel_group: 500
              channel_group_mode: active
