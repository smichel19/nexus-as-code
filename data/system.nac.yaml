      configuration:
        system:
          clock:
            timezone_name: PARIS
            timezone_hours: 1
            timezone_minutes: 0
            summer_time:
              name: CEST
              offset_minutes: 60
              start_week: 5
              start_day: Sun
              start_month: Mar
              start_time: "02:00"
              end_week: 5
              end_day: Sun
              end_month: Oct
              end_time: "03:00"
          hostname: ${hostname}
          mtu: 9216
        spanning_tree:
