---
nxos:
  templates:
    - name: VPC_PO1000
      type: model
      configuration:
        interfaces:
          port_channels:
            - id: 1000
              description: "vPC Po1000"
              switchport:
                mode: trunk
                trunk_allowed_vlans:
                  ranges:
                    - from: 1
                      to: 4094
              mtu: 9216
              lacp:
                rate: fast
                min_links: 1
                max_bundle: 32
              spanning_tree:
                port_type: normal
                guard: none
              vpc_id: 1000
          ethernets:
            - id: 1/3
              channel_group_force: true
              channel_group: 1000
              channel_group_mode: active
            - id: 1/4
              channel_group_force: true
              channel_group: 1000
              channel_group_mode: active
